[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uil-dict-skills"
version = "0.1.0"
description = "UIL Dictionary Skills practice deck: spelling-list PDF to spoken-word audio drills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ed Seabolt" }]
dependencies = ["openai==3.26.0"]

[project.urls]
Repository = "https://github.com/edseabolt/uil-dict-skills"
Issues = "https://github.com/edseabolt/uil-dict-skills/issues"

[project.optional-dependencies]
dev = [
    "autoflake>=2.3",
    "black>=24",
    "isort>=5.13",
    "mypy>=1.10",
    "pylint>=3.2",
    "pytest>=8",
]

[project.scripts]
uil-preprocess = "uil_dict_skills.preprocess:main"
uil-text-to-speech = "uil_dict_skills.text_to_speech:main"
uil-play = "uil_dict_skills.play:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.autoflake]
in-place = true
remove-all-unused-imports = true
remove-unused-variables = true

[tool.mypy]
files = ["src", "tests"]
disallow_untyped_defs = true
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pylint.format]
max-line-length = 100

[tool.pylint.main]
# run as: .venv/bin/pylint src
# accepted deviations, applied repo-wide:
# - logging-fstring-interpolation: f-strings in logging are this repo's
#   established style; messages are plain diagnostics, not hot paths
disable = ["logging-fstring-interpolation"]
